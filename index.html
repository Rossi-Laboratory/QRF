<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantum Radiance Fields: A Quantum-Powered Photorealistic Rendering</title>
  <script>
    window.difyChatbotConfig = {
      token: 'vFiKdrj60ZNurQsL'
    };
  </script>
  <script src="https://udify.app/embed.min.js" id="vFiKdrj60ZNurQsL" defer></script>
  <style>
    :root {
      --bg: #f9f9f9;
      --fg: #333;
      --link: #2980b9;
      --accent: #2c3e50;
    }
    body.dark-mode {
      --bg: #1e1e1e;
      --fg: #e0e0e0;
      --link: #4aa3ff;
      --accent: #88c0d0;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      transition: background 0.3s, color 0.3s;
    }
    header {
      background: var(--accent);
      color: white;
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: 1.5rem;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }
    nav a {
      color: white;
      text-decoration: none;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .toggle-theme {
      background: transparent;
      color: white;
      border: 1px solid white;
      padding: 0.25rem 0.75rem;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.3s ease;
    }
    .toggle-theme:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    main {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }
    section {
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 0.6s ease-out forwards;
    }
    section:nth-of-type(n) {
      animation-delay: calc(0.2s * var(--i));
    }
    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: none;
      }
    }
    h2, h3 {
      color: var(--accent);
    }
    a {
      color: var(--link);
    }
    img {
      max-width: 100%;
      border-radius: 8px;
      margin: 1rem 0;
    }
    iframe {
      width: 100%;
      border: none;
      margin: 2rem 0;
      border-radius: 8px;
    }
    #topBtn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
      display: none;
    }
    @media screen and (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }
      nav {
        gap: 1rem;
        margin-top: 0.5rem;
      }
      .toggle-theme {
        margin-top: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Quantum Radiance Fields</h1>
    <div>
      <nav>
        <a href="#">Paper</a>
        <a href="#">Code</a>
        <a href="#">Demo</a>
        <a href="#">Video</a>
      </nav>
      <button id="themeToggle" class="toggle-theme">🌙 Dark Mode</button>
    </div>
  </header>
  <main>
    <!-- 現有 section 內容保留不變，自動套用動畫與 RWD -->
    <!-- 動畫延遲 index 加入： -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll("main section").forEach((el, i) => {
          el.style.setProperty("--i", i);
        });
      });
    </script>
  </main>
  <button id="topBtn" onclick="window.scrollTo({ top: 0, behavior: 'smooth' });">↑ Top</button>
  <script>
    const btn = document.getElementById("topBtn");
    const toggleBtn = document.getElementById("themeToggle");

    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark-mode");
      toggleBtn.textContent = "☀️ Light Mode";
    }

    window.onscroll = () => {
      btn.style.display = window.scrollY > 300 ? "block" : "none";
    };

    function toggleDarkMode() {
      document.body.classList.toggle("dark-mode");
      const isDark = document.body.classList.contains("dark-mode");
      toggleBtn.textContent = isDark ? "☀️ Light Mode" : "🌙 Dark Mode";
      localStorage.setItem("theme", isDark ? "dark" : "light");
    }

    toggleBtn.addEventListener("click", toggleDarkMode);
  </script>
</body>
</html>
